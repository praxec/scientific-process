name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  BIN: scientific-process

jobs:
  create-release:
    name: validate + draft release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: meta
        name: validate tag against package and server metadata
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sh scripts/check-version-sync.sh --tag "$TAG"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving it as-is"
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi

  binaries:
    name: build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04,     ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, ext: tar.gz }
          - { target: x86_64-apple-darwin,        os: macos-15-intel,   ext: tar.gz }
          - { target: aarch64-apple-darwin,       os: macos-15,         ext: tar.gz }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   ext: zip }
          - { target: aarch64-pc-windows-msvc,    os: windows-11-arm,   ext: zip }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - name: build (locked, current sources)
        shell: bash
        run: cargo build --locked --release --bin "$BIN" --target "${{ matrix.target }}"
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          asset="${BIN}-${TARGET}.${EXT}"
          mkdir -p dist
          exe=""
          [ "$EXT" = "zip" ] && exe=".exe"
          src="target/${TARGET}/release/${BIN}${exe}"
          [ -f "$src" ] || { echo "::error::built binary not found: $src"; exit 1; }
          if [ "$EXT" = "zip" ]; then
            SRC="target/${TARGET}/release/${BIN}${exe}" DEST="dist/${asset}" \
              pwsh -NoProfile -NonInteractive -Command 'Compress-Archive -Path $env:SRC -DestinationPath $env:DEST -Force'
          else
            tar -czf "dist/${asset}" -C "target/${TARGET}/release" "${BIN}"
          fi
          [ -s "dist/${asset}" ] || { echo "::error::packaged asset is empty: dist/${asset}"; exit 1; }
      - name: MCP protocol smoke on the packaged binary (initialize + tools/list)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          asset="${BIN}-${TARGET}.${EXT}"
          tmp="dist/.smoke"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          if [ "$EXT" = "zip" ]; then
            pwsh -NoProfile -NonInteractive -Command "Expand-Archive -Path 'dist/${asset}' -DestinationPath '$tmp' -Force"
          else
            tar -xzf "dist/${asset}" -C "$tmp"
          fi
          exe=""
          case "$TARGET" in *windows*) exe=".exe";; esac
          found="$(find "$tmp" -type f -name "${BIN}${exe}" | head -n 1)"
          [ -n "$found" ] || { echo "::error::packaged binary not found in dist/${asset}"; exit 1; }
          node scripts/mcp-smoke.mjs "$found"
      - name: upload packaged asset to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber

  finalize:
    name: aggregate metadata + publish
    needs: [create-release, binaries]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: download all packaged assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern '*.tar.gz' --pattern '*.zip'
      - name: aggregate checksums + manifest (fails on incomplete matrix)
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          SOURCE_SHA: ${{ needs.create-release.outputs.source_sha }}
        run: |
          set -euo pipefail
          sh scripts/release-manifest.sh --assets-dir dist --out-dir dist \
            --version "$VERSION" --source-sha "$SOURCE_SHA" --binary "$BIN"
      - name: upload aggregated metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/checksums.sha256 dist/release-manifest.json \
            scripts/install.sh scripts/install.ps1 --clobber
      # ──────────────────────────────────────────────────────────────────────
      # npm launcher: NOT WIRED UP YET.
      # A later deliverable adds an `npm/` launcher. When it lands, add an
      # `npm` job here (mirroring the cpm-planner standard) that publishes the
      # tarball, and in this job pack `npm/` and attach the tarball plus its
      # digest (npm-package.sha256) before the release is published.
      # ──────────────────────────────────────────────────────────────────────
      - name: publish release (complete matrix verified)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false

  # Container image and MCP registry entry, built from the release binaries.
  image:
    name: image
    needs: finalize
    uses: ./.github/workflows/image.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
      id-token: write
