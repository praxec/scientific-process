[package]
name = "scientific-process"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "scientific-process"
path = "src/main.rs"

[lib]
name = "scientific_process"
path = "src/lib.rs"

[features]
default = ["jev"]
jev = ["dep:reqwest", "dep:async-trait"]

[dependencies]
rmcp = { version = "1.7", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
anyhow = "1"
async-trait = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"
